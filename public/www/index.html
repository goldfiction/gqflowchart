<!DOCTYPE html>
<html>
    <head>
        <title>Flowchart</title>

        <script src="/js/jquery-3.7.1.min.js"></script>
        <script src="https://unpkg.com/jquery-position-event"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="/css/jquery-ui.css">
        <link rel="stylesheet" href="/css/aceditor.css">
        <link rel="stylesheet" href="/css/filetree.css">
        <link rel="stylesheet" href="/keyboard/index.css">
        <link rel="stylesheet" href="/css/custom.css">

        <script src="/js/bootstrap.min.js"></script>
        <script src="/js/jquery-ui.min.js"></script>
        <script src="/js/draggable.js"></script>


        <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.terminal/2.34.0/js/jquery.terminal.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.terminal/2.34.0/css/jquery.terminal.css" />

        <link rel="stylesheet" href="/css/bootstrap.min.css">
    </head>
<body>
    <div class="filegroup">
        <div class="filetree">
            <ul class="main-tree">
            </ul>
        </div>
    </div>
    <div id="start"></div>
    <div id="etemplate" style="display:none;">
        <div id="editor" class="editor resizable-div"></div>
        <div id="editorcursor" class="editorcursor editorbutton fullimage" title="Move">
            <!--  <img src="/images/drag-handle.svg" alt="Sample Image">  -->
            <button type="button" aria-label="Move">
                <i class="fa-solid fa-grip-vertical"></i>
            </button>            
        </div>
        <div id="editorclose" class="editorclose editorbutton" title="Close">
            <button type="button" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="editorsave" class="editorsave editorbutton" title="Save">
            <button type="button" aria-label="Save">
                <i class="fa-solid fa-save"></i>
            </button>
        </div>
        <div id="editorsaveas" class="editorsaveas editorbutton" title="Save As">
            <button type="button" aria-label="Save As">
                <i class="fa-solid fa-floppy-disk"></i>
            </button>
        </div>
        <div id="editorsavecontinous" class="editorsavecontinous editorbutton" title="Save Continous">
            <button type="button" aria-label="Save Continous">
                <i class="fa-solid fa-floppy-disk"></i>
            </button>
        </div>
        <div id="selecttheme" class="selecttheme editorbutton" title="Select Theme">
            <button type="button" aria-label="Select Theme">
                <i class="fa-solid fa-th"></i>
            </button>
        </div>
        
        <div id="themeform" class="themeform posabs" style="display:none; z-index:1000;">
            <form>
                <label for="theme-select">Choose a theme:</label>
                <select id="theme-select" class="theme-select" name="themeOptioon">
                </select>
            </form>
        </div>

    </div>
    <div>
        <div id="fileSelector" class="editorplus bottombutton posabs" title="Select File">
            <input type="file" id="fileInput" class="displaynone">
            <button id="selectFileButton">Select File</button>
        </div>        

        <div id="editorplus" class="editorplus bottombutton posabs" title="New Editor">
            <button type="button" aria-label="New Editor">
                <i class="fa fa-plus">editor</i>
            </button>
        </div>

        <div id="voiceInput" class="voiceInput bottombutton posabs">
            <div id="startVoiceInput">Start Voice Input</div>
            <div id="stopVoiceInput">Stop Voice Input</div>
        </div>

        <div id="togglesoftkeyboard" class="togglesoftkeyboard bottombutton posabs" title="Soft Keyboard">
            <button type="button" aria-label="Soft Keyboard">
                <i class="fa fa-keyboard-o">Soft Keyboards</i>
            </button>
        </div>
        
        <div id="savelayout" class="savelayout bottombutton posabs" title="Save Layout">
            <button type="button" aria-label="Save Layout">
                <i class="fa fa-save">Save Layout</i>
            </button>
        </div>




    </div>
    <div id="terminalgroup" class="divgroup resizable-div scrollable-div">
        <div id="my-terminal"></div>
    </div>
    <div id="dropgroup" class="divgroup resizable-div">
        <div id="dropzone">
            Drop files here
        </div>

        <div>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" id="myFile" name="myFile" />
                <button type="submit" id="uploadButton">Upload</button>
            </form>
        </div>

        <div>
            <form id="downloadForm">
                <input type="text" id="file" name="file" style="width:290px;"/>
                <button type="submit" id="downloadButton">Download</button>
            </form>
        </div>
    </div>

    <div class="keyboard-wrapper resizable-div">
        <div class="simple-keyboard"></div>
    </div>
